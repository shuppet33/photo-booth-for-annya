<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="./global.css">
    <title>Photo Booth For Anna</title>
</head>
<body>

<h2>
  Photo Booth
</h2>

<div class="container">

  <video autoplay playsinline muted class="camera"></video>

  <div>
    <div class="countdown">

    </div>
    <div>
      <button class="buttonOn">
        Camera On
      </button>

      <button class="takePhoto">
        Take Photo
      </button>
    </div>
  </div>

  <canvas class="photo"></canvas>
</div>

<script src="./camera.js"></script>
<script src="./countdown.js"></script>
<script src="./app.js"></script>
<script src="./init.js"></script>
</body>
</html>
